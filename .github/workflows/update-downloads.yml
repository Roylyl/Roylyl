name: Update total downloads badge

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_downloads.py
      - .github/workflows/update-downloads.yml

permissions:
  contents: write

concurrency:
  group: profile-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count public release-asset downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_downloads.py
      - name: Save badge data when changed
        run: |
          git add assets/downloads.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update total downloads badge'
          git push
