name: Update profile visuals

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_downloads.py
      - scripts/update_contributions.py
      - scripts/update_stats.py
      - .github/workflows/update-downloads.yml

permissions:
  contents: write

concurrency:
  group: profile-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public statistics card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Update downloads and contribution heatmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/update_downloads.py
          python scripts/update_contributions.py
      - name: Save badge data when changed
        if: ${{ !cancelled() }}
        run: |
          git add assets/downloads.json assets/contributions.svg assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update profile visuals'
          git push
