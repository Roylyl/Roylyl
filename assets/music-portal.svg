<svg xmlns="http://www.w3.org/2000/svg" width="525.252525" height="150" viewBox="-5.252525 0 525.252525 150"><style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes wave{0%,100%{transform:scaleY(.35)}45%{transform:scaleY(1)}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes reveal{0%,15%{clip-path:inset(0 100% 0 0)}55%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes swap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}.signal{stroke-dasharray:16 170;animation:travel 12s linear infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-in-out infinite}.typing{animation:reveal 7s steps(8,end) infinite}.disc{transform-box:fill-box;transform-origin:center;animation:rotate 12s linear infinite}.swap{animation:swap 8s ease-in-out infinite}.alternate{animation-delay:-4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.alternate{opacity:0}}
</style><defs><clipPath id="module-corners"><rect width="520" height="150" rx="16.980"/></clipPath></defs><g clip-path="url(#module-corners)"><rect rx="16.980" width="520" height="150" fill="#11162c"/><text x="26" y="42" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#f472b6" letter-spacing="2" font-weight="700">MUSIC ROOM</text><text x="26" y="82" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#e4eaff" >代码暂停，音量调大。</text><text x="26" y="123" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#f472b6" letter-spacing="2">ENTER  ↗</text><g class="disc"><circle cx="430" cy="76" r="49" fill="#080b18" stroke="#f472b6"/><circle cx="430" cy="76" r="36" fill="none" stroke="#392344"/><circle cx="430" cy="76" r="25" fill="none" stroke="#392344"/><circle cx="430" cy="76" r="14" fill="#f472b6"/><circle cx="430" cy="76" r="4" fill="#11162c"/><path d="M403 41A44 44 0 0 1 449 36" stroke="#725184" stroke-width="3" fill="none"/></g></g></svg>