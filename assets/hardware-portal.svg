<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150"><style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes wave{0%,100%{transform:scaleY(.35)}45%{transform:scaleY(1)}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes reveal{0%,15%{clip-path:inset(0 100% 0 0)}55%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes swap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}.signal{stroke-dasharray:16 170;animation:travel 12s linear infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-in-out infinite}.typing{animation:reveal 7s steps(8,end) infinite}.disc{transform-box:fill-box;transform-origin:center;animation:rotate 12s linear infinite}.swap{animation:swap 8s ease-in-out infinite}.alternate{animation-delay:-4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.alternate{opacity:0}}
</style><defs><clipPath id="module-corners"><rect width="520" height="150" rx="16.808081"/></clipPath></defs><g clip-path="url(#module-corners)"><rect rx="16.808081" width="520" height="150" fill="#11162c"/><text x="26" y="42" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#67e8f9" letter-spacing="2" font-weight="700">HARDWARE LAB</text><text x="26" y="82" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#e4eaff" >把想法焊出来。</text><text x="26" y="123" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#67e8f9" letter-spacing="2">ENTER  ↗</text><g stroke="#67e8f9" fill="none" stroke-width="2"><rect x="395" y="42" width="68" height="68" rx="9"/><rect x="412" y="59" width="34" height="34" rx="4"/><path d="M405 30V42M405 110V122"/><path d="M383 52H395M463 52H475"/><path d="M421 30V42M421 110V122"/><path d="M383 68H395M463 68H475"/><path d="M437 30V42M437 110V122"/><path d="M383 84H395M463 84H475"/><path d="M453 30V42M453 110V122"/><path d="M383 100H395M463 100H475"/></g><circle class="pulse" cx="429" cy="76" r="8" fill="#67e8f9"></circle></g></svg>