<svg xmlns="http://www.w3.org/2000/svg" width="560" height="174" viewBox="0 0 560 174"><defs><clipPath id="edge"><rect width="560" height="174" rx="18.101010"/></clipPath></defs><style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes wave{0%,100%{transform:scaleY(.35)}45%{transform:scaleY(1)}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes reveal{0%,15%{clip-path:inset(0 100% 0 0)}55%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes swap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}.signal{stroke-dasharray:16 170;animation:travel 12s linear infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-in-out infinite}.typing{animation:reveal 7s steps(8,end) infinite}.disc{transform-box:fill-box;transform-origin:center;animation:rotate 12s linear infinite}.swap{animation:swap 8s ease-in-out infinite}.alternate{animation-delay:-4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.alternate{opacity:0}}
</style><g clip-path="url(#edge)"><rect width="560" height="174" fill="#11162c"/><title>DeerWebTranslator：换种语言，继续探索。</title><text x="24" y="48" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#eef3ff" font-weight="600">DeerWebTranslator</text><text x="24" y="83" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#a6b2d4" >换种语言，继续探索。</text><text x="24" y="136" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#fb923c" letter-spacing="1.5">OPEN PROJECT ↗</text><rect x="399" y="24" width="137" height="126" rx="18" fill="#fb923c" opacity=".06"/><text x="468" y="93" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#fb923c" text-anchor="middle" class="swap">你好</text><text x="468" y="93" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#fb923c" text-anchor="middle" class="swap alternate" opacity="0">Hello</text><text x="468" y="125" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#fb923c" text-anchor="middle">⇄</text></g></svg>