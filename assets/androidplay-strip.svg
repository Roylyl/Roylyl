<svg xmlns="http://www.w3.org/2000/svg" width="300" height="196" viewBox="900 0 300 196"><title>AndroidPlay：打开仓库</title><defs><linearGradient id="neon"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><clipPath id="edge"><rect width="1200" height="196" rx="19.2"/></clipPath></defs><style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes wave{0%,100%{transform:scaleY(.35)}45%{transform:scaleY(1)}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes reveal{0%,15%{clip-path:inset(0 100% 0 0)}55%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes swap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}.signal{stroke-dasharray:16 170;animation:travel 12s linear infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-in-out infinite}.typing{animation:reveal 7s steps(8,end) infinite}.disc{transform-box:fill-box;transform-origin:center;animation:rotate 12s linear infinite}.swap{animation:swap 8s ease-in-out infinite}.alternate{animation-delay:-4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.alternate{opacity:0}}
</style><g clip-path="url(#edge)"><rect width="1200" height="196" fill="#11162c"/><text x="24" y="30" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#94a4cc" letter-spacing="2">CARPLAY / CONNECTED GARAGE</text><path d="M24 158H1176" stroke="#2d3957" stroke-width="2"/><path class="signal" d="M24 158H1176" stroke="url(#neon)" stroke-width="3"/><text x="24" y="76" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="27.5786" fill="#edf3ff" font-weight="600">WinPlay</text><text x="24" y="108" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#60a5fa" letter-spacing="2">WINDOWS</text><text x="245" y="77" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#60a5fa" >↗</text><circle cx="150" cy="158" r="6" fill="#11162c" stroke="#60a5fa" stroke-width="2"/><circle class="pulse" cx="150" cy="158" r="3" fill="#60a5fa" style="animation-delay:-0.0s"/><path d="M300 52V130" stroke="#303953"/><text x="324" y="76" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="27.5786" fill="#edf3ff" font-weight="600">MacPlay</text><text x="324" y="108" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#c4a0ff" letter-spacing="2">MACOS</text><text x="545" y="77" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#c4a0ff" >↗</text><circle cx="450" cy="158" r="6" fill="#11162c" stroke="#c4a0ff" stroke-width="2"/><circle class="pulse" cx="450" cy="158" r="3" fill="#c4a0ff" style="animation-delay:-0.6s"/><path d="M600 52V130" stroke="#303953"/><text x="624" y="76" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="27.5786" fill="#edf3ff" font-weight="600">LinuxPlay</text><text x="624" y="108" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#fbbf24" letter-spacing="2">LINUX</text><text x="845" y="77" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#fbbf24" >↗</text><circle cx="750" cy="158" r="6" fill="#11162c" stroke="#fbbf24" stroke-width="2"/><circle class="pulse" cx="750" cy="158" r="3" fill="#fbbf24" style="animation-delay:-1.2s"/><path d="M900 52V130" stroke="#303953"/><text x="924" y="76" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="27.5786" fill="#edf3ff" font-weight="600">AndroidPlay</text><text x="924" y="108" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#5eeab3" letter-spacing="2">ANDROID</text><text x="1145" y="77" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#5eeab3" >↗</text><circle cx="1050" cy="158" r="6" fill="#11162c" stroke="#5eeab3" stroke-width="2"/><circle class="pulse" cx="1050" cy="158" r="3" fill="#5eeab3" style="animation-delay:-1.7999999999999998s"/></g></svg>